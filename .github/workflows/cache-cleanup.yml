name: 清理指定缓存

on:
  workflow_dispatch:
    inputs:
      target-cache-key:
        description: "需要清理的缓存Key（从编译日志复制）"
        required: true
        type: string
      free_disk:
        description: '是否释放磁盘空间'
        required: false
        default: true
        type: boolean
      ssh_connect:
        description: 'SSH连接'
        required: false
        default: false
        type: boolean

# 环境变量：与原编译保持一致
env:
  SOURCE_DIR: "./openwrt"  # 原编译的SOURCE_DIR，固定为./openwrt
  BUILD_SCRIPT_PATH: "build-openwrt.sh"  # 脚本路径

jobs:
  cache-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          path: ./repo  # 检出到独立目录，避免干扰缓存路径

      - name: 准备build-openwrt.sh
        run: |
          # 定位脚本实际路径（仓库检出目录下）
          ACTUAL_SCRIPT_PATH="./repo/${{ env.BUILD_SCRIPT_PATH }}"
          
          # 检查脚本是否存在
          if [ ! -f "$ACTUAL_SCRIPT_PATH" ]; then
            echo "❌ 未找到脚本：$ACTUAL_SCRIPT_PATH"
            exit 1
          fi
          chmod +x "$ACTUAL_SCRIPT_PATH"
          echo "ACTUAL_SCRIPT_PATH=$ACTUAL_SCRIPT_PATH" >> $GITHUB_ENV
          echo "✅ 已加载build-openwrt.sh"

      - name: 释放磁盘空间
        if: ${{ github.event.inputs.free_disk == 'true' }}
        uses: danshui-git/free-disk-space@main
        continue-on-error: true
        timeout-minutes: 15
        with:
          remove_android: false
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_docker_image: true
          remove_folders: "/usr/share/swift /usr/share/miniconda"

      # 关键：下载缓存的路径与原编译完全一致
      - name: 下载指定缓存
        uses: actions/cache/restore@v4
        with:
          key: ${{ github.event.inputs.target-cache-key }}  # 输入的目标Key
          # 路径完全复制原编译的path，确保匹配
          path: |
            ${{ env.SOURCE_DIR }}/.ccache
            ${{ env.SOURCE_DIR }}/staging_dir
          fail-on-cache-miss: true  # 缓存不存在则失败

      - name: 执行缓存清理（调用原函数）
        run: |
          source "${{ env.ACTUAL_SCRIPT_PATH }}"
          # 进入原编译的SOURCE_DIR（确保函数内相对路径正确）
          cd ${{ env.SOURCE_DIR }} || { echo "❌ 源码目录不存在"; exit 1; }
          echo "🚀 开始清理缓存，当前目录：$(pwd)"
          clean_useless_cache  # 调用你的清理函数（依赖当前目录的相对路径）

      - name: SSH远程连接
        uses: rogueme/debugger-action@main
        if: ${{ github.event.inputs.ssh_connect == 'true' }}
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          TIMEOUT_MIN: 240

      # 上传路径与下载路径一致，覆盖原缓存
      - name: 上传清理后的缓存
        uses: actions/cache/save@v4
        with:
          key: ${{ github.event.inputs.target-cache-key }}
          path: |
            ${{ env.SOURCE_DIR }}/.ccache
            ${{ env.SOURCE_DIR }}/staging_dir

      - name: 清理完成报告
        run: |
          echo "========================================"
          echo "✅ 缓存清理完成"
          echo "目标缓存Key：${{ github.event.inputs.target-cache-key }}"
          echo "清理后总容量："
          du -sh ${{ env.SOURCE_DIR }}/.ccache ${{ env.SOURCE_DIR }}/staging_dir ${{ env.SOURCE_DIR }}/build_dir/target-*
          echo "========================================"