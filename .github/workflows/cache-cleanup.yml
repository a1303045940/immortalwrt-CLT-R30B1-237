name: 清理指定缓存

# 手动触发，仅需输入目标缓存Key
on:
  workflow_dispatch:
    inputs:
      target-cache-key:
        description: "需要清理的缓存Key（如 'openwrt-ccache-1.0'）"
        required: true
        type: string
  free_disk:
    description: '是否释放磁盘空间，防止空间不够'
    required: false
    default: true
    type: boolean

# 环境变量：固定源码目录和脚本路径（根据实际情况修改）
env:
  SOURCE_DIR_NAME: "openwrt"  # 原编译的SOURCE_DIR目录名（固定）
  BUILD_SCRIPT_PATH: "./build-openwrt.sh"  # build-openwrt.sh在当前仓库的路径（固定）

jobs:
  cache-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          path: ./repo  # 检出到临时目录

      - name: 准备build-openwrt.sh
        run: |
          # 定位脚本实际路径（当前仓库下）
          ACTUAL_SCRIPT_PATH="./repo/${{ env.BUILD_SCRIPT_PATH }}"
          
          # 检查脚本是否存在
          if [ ! -f "$ACTUAL_SCRIPT_PATH" ]; then
            echo "❌ 未找到脚本：$ACTUAL_SCRIPT_PATH"
            exit 1
          fi
          chmod +x "$ACTUAL_SCRIPT_PATH"
          
          # 存入环境变量复用
          echo "ACTUAL_SCRIPT_PATH=$ACTUAL_SCRIPT_PATH" >> $GITHUB_ENV
          echo "✅ 已加载build-openwrt.sh"

      - name: 释放Ubuntu磁盘空间
        if: ${{ github.event.inputs.free_disk }}  == 'true'
        uses: danshui-git/free-disk-space@main
        continue-on-error: true
        timeout-minutes: 15
        with:
          remove_android: false
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_docker_image: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/share/chromium /usr/local/share/powershell"

      - name: 下载缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          key: ${{ github.event.inputs.target-cache-key }}
          path: /home/runner/cache-cleanup  # 缓存保存路径（与后续步骤一致）
          fail-on-cache-miss: true  # 缓存不存在则失败

      # 👇 新增：将缓存路径存入环境变量（供后续步骤使用）
      - name: 配置缓存目录
        run: |
          echo "CACHE_DIR=/home/runner/cache-cleanup" >> $GITHUB_ENV
          echo "✅ 缓存目录已配置：/home/runner/cache-cleanup"

      - name: 上传清理后的缓存
        uses: actions/cache/save@v4
        with:
          key: ${{ github.event.inputs.target-cache-key }}
          path: ${{ env.CACHE_DIR }}

      - name: 清理完成
        run: |
          echo "✅ 缓存清理完成"
          echo "缓存Key：${{ github.event.inputs.target-cache-key }}"
          echo "清理后体积：$(du -sh ${{ env.CACHE_DIR }} | awk '{print $1}')"